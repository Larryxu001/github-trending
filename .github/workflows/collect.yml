name: Collect Trending

on:
  schedule:
    - cron: "0 1-23/3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'collect only, or collect and deliver due reports'
        type: choice
        options: [collect, scheduled]
        default: collect

permissions:
  contents: write
  actions: write

# All report/state writers use the same lock; never cancel a running sender.
concurrency:
  group: trending-state
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git and refresh state after acquiring lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
      - name: Collect and deliver due reports
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python report_jobs.py "${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}"
