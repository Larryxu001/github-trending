name: Monthly Trending Report

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# All report/state writers use the same lock; never cancel a running sender.
concurrency:
  group: trending-state
  queue: max
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git and refresh state after acquiring lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
      - name: Run monthly
        env:
          GH_TOKEN: ${{ github.token }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python report_jobs.py monthly
