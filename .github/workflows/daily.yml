name: Daily Trending Report

on:
  schedule:
    # 每小时运行一次（UTC 整点），确保当天日报一定推送成功：
    # - 早上 9 点首次尝试（北京时间，UTC+8 = 01:00 UTC）
    # - 若推送失败（网络/飞书异常），下一小时自动重试，最多覆盖全天 24 次机会
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily pipeline
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python run_daily.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 关键：saved.json 的真源是 CF Worker 用 PAT 管理的，Actions 绝不能提交它，
          # 否则会用自己的旧 checkout 版本覆盖 Worker 刚写入的新收藏（数据丢失根因）。
          git add -A
          git restore --staged saved.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "日报 $(date -u +%F) · 自动生成"
            # 并发保护：push 前先 rebase 拉取远程最新，避免与其他工作流冲突
            git pull --rebase origin main || git pull --rebase origin main
            git push
          fi

      - name: Trigger Pages deploy
        # 关键：GITHUB_TOKEN 的 push 不会触发其他 workflow 的 on:push，
        # 所以这里显式调用 GitHub API 触发 pages.yml，确保网页版归档一定更新。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main || echo "pages trigger skipped (already queued)"
