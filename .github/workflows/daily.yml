name: Daily Trending Report

on:
  schedule:
    # 每天 09:00（北京时间 = UTC 01:00）起每小时抓一次，直到当天成功推送为止：
    #   - 09:00 首次抓榜推送；若失败，last_push.json 未写入，下一小时继续重试（保证最终成功）。
    #   - 一旦成功，run_daily.py 开头检查 last_push.json 会直接跳过，当天绝不再推第二次。
    #   即「每天最多成功推一次，失败则持续重试直到成功」。
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write
  actions: write   # 必需：gh workflow run 触发 pages 部署需要 actions 写权限（否则 403 Resource not accessible）

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily pipeline
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python run_daily.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 关键：saved.json 的真源是 CF Worker 用 PAT 管理的，Actions 绝不能提交它，
          # 否则会用自己的旧 checkout 版本覆盖 Worker 刚写入的新收藏（数据丢失根因）。
          git add -A
          git restore --staged saved.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "日报 $(date -u +%F) · 自动生成"
            # 并发保护：push 前先 rebase 拉取远程最新，避免与其他工作流冲突
            git pull --rebase origin main || git pull --rebase origin main
            git push
          fi

      - name: Trigger Pages deploy
        # 关键：GITHUB_TOKEN 的 push 不会触发其他 workflow 的 on:push，
        # 所以这里显式调用 GitHub API 触发 pages.yml，确保网页版归档一定更新。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main || echo "pages trigger skipped (already queued)"
