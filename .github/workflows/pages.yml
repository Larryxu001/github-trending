name: Deploy GitHub Pages

on:
  # 每次推送到 main（日报/月报工作流提交归档后自动触发）
  push:
    branches: [main]
    # saved.json 是真源数据（CF Worker 用 PAT 独占管理），精选页是前端动态 fetch Worker，
    # 不依赖静态部署。忽略它可避免「每次收藏都触发一次 pages 部署」的无谓排队。
    paths-ignore:
      - 'saved.json'
      - 'collected.json'
      - 'deliveries.json'
      - 'last_push.json'
      - 'pushed.json'
      - 'health_state.json'
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 允许同一时间只有一个部署；新部署进来时直接取消旧的在途部署（而非排队累积一堆 cancelled）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 托管 reports_web/（每日网页版归档 + 索引页）
          path: reports_web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
