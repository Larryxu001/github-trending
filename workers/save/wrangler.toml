name = "github-trending-save"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
routes = [{ pattern = "github-trending.51vipai.com", custom_domain = true }]

# Cloudflare Cron 定时触发（每天北京时间 09:00 = UTC 01:00）：
# 作为 GitHub 自身 schedule（best-effort、可能延迟）的免费兜底，
# 降低 GitHub schedule 延迟或漏触发的风险，仍受上游服务可用性影响。
[triggers]
crons = ["0 1-23/3 * * *", "20 3 * * *"]

# 部署后需在 Cloudflare Dashboard 设置 secrets：
#   GH_PAT    = 你的 GitHub Personal Access Token（需要 repo 写权限 + workflow 触发权限）
#   GH_REPO   = Larryxu001/github-trending（可选，默认已填）
#   GH_BRANCH = main（可选）

[observability]
enabled = true

[observability.traces]
enabled = true
